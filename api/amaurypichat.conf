<VirtualHost *:80>
    ServerName amaurypichat.fr
    ServerAlias www.amaurypichat.fr

    RewriteEngine on
    RewriteRule ^ https://dev2site.net%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/amaury-80-error.log
    CustomLog ${APACHE_LOG_DIR}/amaury-80-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName amaurypichat.fr
    ServerAlias www.amaurypichat.fr

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dev2site.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dev2site.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    RewriteEngine on
    RewriteRule ^ https://dev2site.net%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/amaury-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/amaury-ssl-access.log combined
</VirtualHost>
</IfModule>