# Redirection HTTP -> HTTPS via port 8080
<VirtualHost *:80>
    ServerName dev2site.net
    ServerAlias www.dev2site.net amaurypichat.fr

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =www.dev2site.net [OR]
    RewriteCond %{SERVER_NAME} =amaurypichat.fr [OR]
    RewriteCond %{SERVER_NAME} =dev2site.net
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    DocumentRoot /var/www/html/prod
    ErrorLog ${APACHE_LOG_DIR}/8080-error.log
    CustomLog ${APACHE_LOG_DIR}/8080-access.log combined
</VirtualHost>

# HTTPS sur port 443
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dev2site.net
    ServerAlias www.dev2site.net

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf

    DocumentRoot /var/www/html/prod
    <Directory /var/www/html/prod>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

            ErrorLog ${APACHE_LOG_DIR}/443-error.log
CustomLog ${APACHE_LOG_DIR}/443-access.log combined
SSLCertificateFile /etc/letsencrypt/live/dev2site.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dev2site.net/privkey.pem
</VirtualHost>
</IfModule>

# Reverse Proxy sur 4000 -> 5000
<VirtualHost *:4000>
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/dev2site.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dev2site.net/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog ${APACHE_LOG_DIR}/api-https-4000-error.log
    CustomLog ${APACHE_LOG_DIR}/api-https-4000-access.log combined
</VirtualHost>

