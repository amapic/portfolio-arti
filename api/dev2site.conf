# Redirection HTTP -> HTTPS
<VirtualHost *:80>
    ServerName dev2site.net
    ServerAlias www.dev2site.net amaurypichat.fr www.amaurypichat.fr

    RewriteEngine on
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]

    DocumentRoot /var/www/html/prod
    ErrorLog ${APACHE_LOG_DIR}/8080-error.log
    CustomLog ${APACHE_LOG_DIR}/8080-access.log combined
</VirtualHost>

# HTTPS sur port 443 avec accès réel
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dev2site.net
    ServerAlias www.dev2site.net amaurypichat.fr www.amaurypichat.fr

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dev2site.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dev2site.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    DocumentRoot /var/www/html/prod

    <Directory /var/www/html/prod>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Système complexe de proxy vers différents ports selon URL
    ProxyPreserveHost On
    ProxyPass "/app1/" "http://localhost:4000/"
    ProxyPassReverse "/app1/" "http://localhost:4000/"

    ProxyPass "/app2/" "http://localhost:4001/"
    ProxyPassReverse "/app2/" "http://localhost:4001/"

    ProxyPass "/app3/" "http://localhost:4002/"
    ProxyPassReverse "/app3/" "http://localhost:4002/"

    ErrorLog ${APACHE_LOG_DIR}/ssl-dev2site-error.log
    CustomLog ${APACHE_LOG_DIR}/ssl-dev2site-access.log combined
</VirtualHost>
</IfModule>